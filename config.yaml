train:
    batch_size: 12
    lr: 2.5e-5
    epochs: 20
    gradient_accumulation_steps: 14
    dtype: "fp32" # bf16, fp32 (recommended as uses mixed precission)
    use_checkpointing: True
    train_te: False
    wd: 0.01
    warmup: 0.05
    objective: "flow_matching" # "flow_matching", "ddpm"
    shift: 2.0 # for flow_matching
    snr_gamma: 5.0 # for ddpm
    input_perturb: 0.1 # for ddpm
    cfg_dropout_prob: 0.1
    seed: 23
    use_bitsandbytes: True
    train_only_output: False # train only output head
    skip_save_n_times: 4
    run_stability_check: False # breaks torch compile use for debug only
    world_size: 2
    use_cos_scheduler: False
    use_ot: False
    use_ema: False
    ema_decay: 0.999
    use_kahan_sum: False
    use_cpu_accumulator: False
    compile_model: True
    gpu_peak_tflops: 5.0

data:
    dataset_type: "streaming"
    h5_path: "data" # Path to the folder
    streaming_dataset_name: "aipracticecafe/test-danbooru"
    num_workers: 4
    prefetch_factor: 6
    load_into_ram: True
    tag_dropout: 0.1
    use_shift_crop: True
    resolution: 256

models:
    model_type: "sprint_dual"
    resume_from_checkpoint: null # Path to a checkpoint folder
    output_head_path: null
    hf_text_encoder: "LiquidAI/LFM2.5-230M"
    hidden_size: 512
    depth: 12
    num_heads: 8
    encoder_depth: 2
    decoder_depth: 2
    drop_ratio: 0.75
    drop_target: "image"
    residual_type: "concat_linear"
    cfg_mask_prob: 0.0

paths:
    models: "models" # Root path containing unet/, vae/, clip/, tokenizer/

logging:
    project: "YOUR-WANDB-PROJECT"
    wandb_entity: "YOUR-WANDB"
    save_interval: 1000
    hf_repo: "YOUR-HF-REPO"
    wandb_run_name_prefix: "asuka-fm"

sampling:
    interval: 50
    config_file: "sample.toml"
